version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # A família crewai/langchain é ignorada por completo, não só nos majors.
    #
    # Tentei antes liberar só patches, e não funciona: langchain-openai 0.1.25
    # (um patch a partir de 0.1.7) exige langchain-core>=0.2.40, enquanto
    # langchain 0.1.20 e langchain-community 0.0.38 exigem <0.2.0. Qualquer
    # bump parcial dentro dessa família é insolúvel — a CI falhou com
    # ResolutionImpossible no primeiro PR.
    #
    # As cinco só sobem em conjunto, e subir significa reescrever src/agents.py
    # e src/tasks.py: o crewai reorganizou a definição de agentes e tasks, e o
    # langchain dividiu o pacote em core/community entre 0.1 e 0.3. Isso é
    # migração deliberada, com os testes estruturais acompanhando — não é
    # trabalho que um PR automático consiga fazer.
    #
    # Sem update-types, o ignore vale para toda e qualquer versão.
    ignore:
      - dependency-name: "crewai"
      - dependency-name: "crewai-tools"
      - dependency-name: "langchain"
      - dependency-name: "langchain-openai"
      - dependency-name: "langchain-community"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
