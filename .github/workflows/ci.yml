name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Chaves falsas: os testes são estruturais e não chamam APIs externas,
      # mas as bibliotecas exigem que as variáveis existam.
      OPENAI_API_KEY: test-key-not-real
      SERPER_API_KEY: test-key-not-real
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff mypy

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Run tests
        run: pytest tests/ -v
